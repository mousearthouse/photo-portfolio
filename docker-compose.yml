services:
  app:
    build:
      context: ./photo-portfolio
      dockerfile: Dockerfile
    container_name: portfolio
    expose:
      - "3000"
    volumes:
      - ./photos:/photos:ro
      - ./decorations:/decorations:ro

  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./photo-portfolio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./etc/letsencrypt:/etc/letsencrypt:ro
      - ./photos:/usr/share/nginx/html/photos:ro
      - ./decorations:/usr/share/nginx/html/decorations:ro