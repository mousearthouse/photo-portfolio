services:
  app:
    build:
      context: .
      dockerfile: photo-portfolio/Dockerfile
    container_name: portfolio
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    depends_on:
      - app

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./etc/letsencrypt/live/mousearthouse.space:/etc/nginx/certs:ro