server {
    listen 80;
    server_name print8creen.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name print8creen.ru;

    root /var/www/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/print8creen.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/print8creen.ru/privkey.pem;

    location / {
        proxy_pass http://app:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /usr/share/nginx/html/photos/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /decorations/ {
        alias /usr/share/nginx/html/decorations/;
        expires 30d;
    }
}
